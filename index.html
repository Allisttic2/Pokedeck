<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokedeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe8;--card:#fff;--ink:#22232a;--mut:#767782;--red:#e63946;--red2:#b3202d;--ok:#2e9e5b;--bd:#e6e1d6;--gold:#f2b705;--sh:0 2px 8px rgba(30,20,10,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#14151a;--card:#212329;--ink:#f1f1f4;--mut:#9b9ca6;--bd:#34363e;--sh:0 2px 8px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.4 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
 background:var(--bg) radial-gradient(circle at 1px 1px,rgba(120,110,90,.12) 1px,transparent 0) 0 0/22px 22px}
.wrap{max-width:1000px;margin:0 auto}
header{position:relative;overflow:hidden;color:#fff;padding:18px 16px 20px;
 background:linear-gradient(135deg,var(--red),var(--red2));border-bottom:6px solid #1d1d22;box-shadow:0 4px 16px rgba(0,0,0,.2)}
header::after{content:"";position:absolute;right:-50px;top:-50px;width:210px;height:210px;border-radius:50%;
 background:linear-gradient(#fff3 0 46%,#1d1d2255 46% 54%,#fff1 54%);border:6px solid #fff3;pointer-events:none}
header .wrap{position:relative;z-index:1}
h1{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:600 28px Fredoka,Nunito,system-ui,sans-serif;letter-spacing:.5px}
.ball{width:30px;height:30px;border-radius:50%;border:3px solid #1d1d22;flex:none;
 background:radial-gradient(circle,#fff 0 18%,#1d1d22 19% 26%,transparent 27%),linear-gradient(#e63946 0 46%,#1d1d22 46% 54%,#fff 54%)}
select,input{font:inherit;padding:11px 14px;border-radius:14px;border:2px solid transparent;background:var(--card);color:var(--ink);width:100%;box-shadow:var(--sh)}
input{border-color:var(--bd)}
select:focus,input:focus{outline:none;border-color:var(--gold)}
.bar{height:14px;background:#0003;border-radius:8px;overflow:hidden;margin-top:14px;border:2px solid #1d1d22}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#fff3b0);transition:width .4s}
#stat{margin-top:8px;font-weight:700;font-size:14px;text-shadow:0 1px 2px #0004}
.tabs{display:flex;gap:6px;padding:14px 16px 10px;flex-wrap:wrap}
.tabs button{flex:1 1 70px;padding:9px 12px;border:2px solid var(--bd);background:var(--card);color:var(--ink);border-radius:999px;font:600 15px Fredoka,Nunito,sans-serif;cursor:pointer;transition:.15s}
.tabs button:hover{transform:translateY(-1px)}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 10px rgba(230,57,70,.4)}
.s{padding:0 16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;padding:16px 16px 40px}
.c{position:relative;background:var(--card);border:2px solid var(--bd);border-top:5px solid var(--g,#999);border-radius:16px;padding:8px 6px 10px;text-align:center;cursor:pointer;user-select:none;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.c:hover{transform:translateY(-3px) rotate(-.6deg);box-shadow:0 8px 18px rgba(30,20,10,.18)}
.c img{display:block;margin:2px auto 4px;width:88px;height:88px;image-rendering:pixelated;border-radius:50%;
 background:radial-gradient(circle,color-mix(in srgb,var(--g) 28%,transparent),transparent 70%);opacity:.5;filter:grayscale(1);transition:.25s}
.c.got img{opacity:1;filter:none}
.c b{display:inline-block;padding:1px 9px;border-radius:999px;background:color-mix(in srgb,var(--g) 18%,transparent);color:var(--mut);font-size:11px;font-weight:700}
.c span{display:block;margin-top:4px;font:600 15px Fredoka,Nunito,sans-serif;text-transform:capitalize;word-break:break-word}
.c.got{border-color:var(--ok);border-top-color:var(--g)}
.c.got::before{content:"✓";position:absolute;top:8px;left:8px;width:20px;height:20px;line-height:20px;border-radius:50%;background:var(--ok);color:#fff;font-size:12px;font-weight:700}
.sh{position:absolute;top:4px;right:4px;border:0;background:none;font-size:18px;cursor:pointer;padding:4px;opacity:.3;filter:grayscale(1);transition:.2s}
.sh:hover{opacity:.8;transform:scale(1.2)}
.c.shiny .sh{opacity:1;filter:none}
.c.shiny{border-color:var(--gold);background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 22%,var(--card)),var(--card) 60%);box-shadow:0 0 0 2px #f2b70544,0 6px 18px #f2b70555}
#msg{padding:16px;color:var(--mut)}
.g1{--g:#e63946}.g2{--g:#e0a526}.g3{--g:#2a9d8f}.g4{--g:#4361ee}.g5{--g:#6c757d}.g6{--g:#e56b9e}.g7{--g:#f77f00}.g8{--g:#7b2cbf}.g9{--g:#c1121f}
</style>
</head>
<body>
<header><div class="wrap">
<h1><span class="ball"></span>Pokedeck</h1>
<select id="game" aria-label="Spel"></select>
<div class="bar"><i id="fill"></i></div>
<div id="stat"></div>
</div></header>
<div class="wrap">
<div class="tabs" id="tabs"></div>
<div class="s"><input id="q" placeholder="Sök namn eller nummer…"></div>
<div id="msg">Hämtar Pokémon…</div>
<div id="grid"></div>
</div>
<script>
const API="https://pokeapi.co/api/v2/";
const SPR=id=>"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/"+id+".png";
const SPRS=id=>"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/"+id+".png";
// [namn, [pokédex-slugs hos PokeAPI]]  – "national" = alla
const GAMES=[
["Alla Pokémon (nationell)",["national"]],
["Red / Blue / Yellow",["kanto"]],
["Gold / Silver / Crystal",["original-johto"]],
["Ruby / Sapphire / Emerald",["hoenn"]],
["FireRed / LeafGreen",["kanto"]],
["Diamond / Pearl",["original-sinnoh"]],
["Platinum",["extended-sinnoh"]],
["HeartGold / SoulSilver",["updated-johto"]],
["Black / White",["original-unova"]],
["Black 2 / White 2",["updated-unova"]],
["X / Y",["kalos-central","kalos-coastal","kalos-mountain"]],
["Omega Ruby / Alpha Sapphire",["updated-hoenn"]],
["Sun / Moon / Ultra Sun / Ultra Moon",["updated-alola"]],
["Let's Go Pikachu / Eevee",["letsgo-kanto"]],
["Sword / Shield (+ Isle of Armor, Crown Tundra)",["galar","isle-of-armor","crown-tundra"]],
["Brilliant Diamond / Shining Pearl",["original-sinnoh"]],
["Legends: Arceus",["hisui"]],
["Scarlet / Violet (+ DLC)",["paldea","kitakami","blueberry"]],
["Legends: Z-A (+ Mega Dimension)",["lumiose-city","hyperspace"]]
];
const $=id=>document.getElementById(id);
// Pokémon som inte kan vara shiny (källa: Serebii.net/games/shiny.shtml).
// SHINY_GLOBAL = låsta i alla spel. SHINY_LOCK = nyckel är spelets plats i listan ovan
// (0 = första, 1 = Red/Blue/Yellow ...), värdet "all" eller en lista med nationella nummer.
const SHINY_GLOBAL=[494,720,789,790,801,802,891,892,893,896,897,898,1009,1010,1014,1015,1016,1017,1020,1021,1022,1023,1024,1025];
const SHINY_LOCK={
 1:"all",
 8:[643,644],
 9:[643,644],
 10:[144,145,146,150,716,717,718],
 11:[382,383,384,386],
 12:[718,785,786,787,788,791,792,800],
 14:[144,145,146,647,772,803,888,889,890],
 15:[151,385],
 16:[480,481,482,483,484,485,486,487,488,489,490,491,492,493,641,642,645,905],

 18:[150,382,383,384,485,491,647,648,649,716,717,718,719,721,807,808,809,999],
 17:[144,145,146,243,244,245,249,250,380,381,382,383,384,638,639,640,643,644,646,648,791,792,800,999,1001,1002,1003,1004,1007,1008]
};
let names=[],list=[],filter="alla",store={};
try{store=JSON.parse(localStorage.getItem("dex")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("dex",JSON.stringify(store))}catch(e){}};
GAMES.forEach((g,i)=>$("game").add(new Option(g[0],i)));
[["alla","Alla"],["fangad","Fångade"],["saknas","Saknas"],["shiny","✨ Shiny"]].forEach(([k,t])=>{
 const b=document.createElement("button");b.textContent=t;b.dataset.k=k;
 b.onclick=()=>{filter=k;render()};$("tabs").append(b)});
const gen=n=>n<=151?1:n<=251?2:n<=386?3:n<=493?4:n<=649?5:n<=721?6:n<=809?7:n<=905?8:9;
const pad=n=>"#"+String(n).padStart(4,"0");
const getJSON=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.json()};

async function loadNames(){
 try{const c=JSON.parse(localStorage.getItem("names")||"null");if(c&&c.length>=1000)return c}catch(e){}
 const d=await getJSON(API+"pokemon-species?limit=1025");
 const n=d.results.map(r=>r.name.replace(/-/g," "));
 try{localStorage.setItem("names",JSON.stringify(n))}catch(e){}
 return n;
}
async function loadDex(gi){
 const slugs=GAMES[gi][1];
 if(slugs[0]==="national")return names.map((_,i)=>i+1);
 const key="dex2_"+slugs.join("+");
 try{const c=JSON.parse(localStorage.getItem(key)||"null");if(c)return c}catch(e){}
 const res=await Promise.allSettled(slugs.map(s=>getJSON(API+"pokedex/"+s)));
 const parts=res.filter(r=>r.status==="fulfilled").map(r=>r.value);
 if(!parts.length)throw 0;
 const seen=new Set(),l=[];
 parts.forEach(p=>[...p.pokemon_entries].sort((a,b)=>a.entry_number-b.entry_number).forEach(e=>{
  const id=+e.pokemon_species.url.split("/").filter(Boolean).pop();
  if(!seen.has(id)){seen.add(id);l.push(id)}}));
 try{localStorage.setItem(key,JSON.stringify(l))}catch(e){}
 return l;
}
async function selectGame(){
 $("msg").textContent="Hämtar lista…";$("grid").innerHTML="";
 try{list=await loadDex($("game").value);$("msg").textContent=""}
 catch(e){$("msg").textContent="Kunde inte hämta spelets Pokédex – visar nationell lista.";list=names.map((_,i)=>i+1)}
 render();
}
function render(){
 const gi=$("game").value;store[gi]=store[gi]||{};
 let got=store[gi];
 if(gi==="0"){got={};for(const k in store)for(const id in store[k])got[id]=Math.max(got[id]||0,store[k][id])} // nationell = summan av alla spel
 const q=$("q").value.trim().toLowerCase().replace(/^#/,"");
 [...$("tabs").children].forEach(b=>b.classList.toggle("on",b.dataset.k===filter));
 let n=0,ns=0,h="";
 const national=GAMES[gi][1][0]==="national",lock=SHINY_LOCK[gi];
 for(const [idx,id] of list.entries()){
  const name=names[id-1]||"?",has=!!got[id],locked=lock==="all"||SHINY_GLOBAL.includes(id)||(Array.isArray(lock)&&lock.includes(id)),sh=got[id]===2&&!locked,num=String(idx+1);
  if(has)n++;
  if(sh)ns++;
  if(filter==="fangad"&&!has)continue;
  if(filter==="saknas"&&has)continue;
  if(filter==="shiny"&&!sh)continue;
  if(q&&!(name.includes(q)||num===q.replace(/^0+/,"")||String(id)===q.replace(/^0+/,"")))continue;
  const label=national?pad(id):"#"+num.padStart(3,"0")+" · N"+id;
  h+=`<div class="c g${gen(id)}${has?" got":""}${sh?" shiny":""}" data-n="${id}">${locked?"":`<button class="sh" title="Shiny" aria-label="Markera som shiny">✨</button>`}<img loading="lazy" alt="" src="${sh?SPRS(id):SPR(id)}"><b>${label}</b><span>${name}</span></div>`;
 }
 $("grid").innerHTML=h;
 const t=list.length||1;
 $("fill").style.width=(n/t*100)+"%";
 $("stat").textContent=n+" av "+list.length+" fångade ("+Math.round(n/t*100)+"%) · ✨ "+ns+" shiny";
}
$("grid").onclick=e=>{const c=e.target.closest(".c");if(!c)return;
 const gi=$("game").value,n=c.dataset.n,g=store[gi];
 if(gi==="0"&&!e.target.closest(".sh")){
  const from=GAMES.map((_,i)=>i).filter(i=>i&&store[i]&&store[i][n]);
  if(from.length){const m=$("msg");m.textContent="Fångad via "+GAMES[from[0]][0]+" – ändra den i det spelet.";setTimeout(()=>{if(m.textContent.startsWith("Fångad via"))m.textContent=""},3000);return}
 }
 if(e.target.closest(".sh"))g[n]=g[n]===2?1:2;
 else if(g[n])delete g[n];else g[n]=1;
 save();render()};
$("game").onchange=selectGame;$("q").oninput=render;
loadNames().then(n=>{names=n;selectGame()}).catch(()=>{$("msg").textContent="Kunde inte nå PokeAPI. Kontrollera internetanslutningen."});
</script>
</body>
</html>
